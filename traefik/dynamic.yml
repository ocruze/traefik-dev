tls:
    certificates:
        - certFile: "/etc/ssl/docker.localhost.pem"
          keyFile: "/etc/ssl/docker.localhost-key.pem"
        - certFile: "/etc/ssl/_wildcard.docker.localhost.pem"
          keyFile: "/etc/ssl/_wildcard.docker.localhost-key.pem"
        - certFile: "/etc/ssl/rootCA.pem"
          keyFile: "/etc/ssl/rootCA-key.pem"
