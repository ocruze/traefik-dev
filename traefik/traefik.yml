api:
    dashboard: true
    insecure: true

entryPoints:
    web:
        address: ":80"
        http:
            redirections:
                entryPoint:
                    to: "websecure"
                    scheme: "https"
                    permanent: true
    websecure:
        address: ":443"
        http:
            tls:
                certResolver: "default"

providers:
    docker:
        watch: true
        exposedByDefault: false
        network: "web_dev"
    file:
        filename: "/etc/traefik/dynamic.yml"
        watch: true

certificatesResolvers:
    default:
        acme:
            email: "orka.cruze@ign.fr"
            storage: "acme.json"
            caServer: "https://acme-v01.api.letsencrypt.org/directory"
            tlsChallenge: {}

log:
    level: "DEBUG"
