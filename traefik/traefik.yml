api:
    dashboard: true
    insecure: false

entryPoints:
    web:
        address: ":80"
        http:
            redirections:
                entryPoint:
                    to: "websecure"
                    scheme: "https"
                    permanent: true
    websecure:
        address: ":443"
        http:
            tls: {}

providers:
    docker:
        watch: true
        exposedByDefault: false
        network: "web_dev"
    file:
        filename: "/etc/traefik/dynamic.yml"
        watch: true

log:
    level: "INFO"
